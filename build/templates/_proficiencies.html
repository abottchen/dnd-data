      <section class="proficiencies">
        <div class="prof-label">Skills</div>
        {%- set prof_skills = [] %}
        {%- for key, val in member.skills.items() if val.prof == "full" %}
          {%- set _ = prof_skills.append(skill_display.get(key, key)) %}
        {%- endfor %}
        <div class="prof-list">{{ prof_skills | join(" &middot; ") | safe }}</div>
      </section>
